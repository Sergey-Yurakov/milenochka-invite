/* ============================ BASE ============================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --font-main: 'Comfortaa', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-title: 'SoyuzGrotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --accent: #E34F7B;
  --ink: #2D1926;
  --muted: #80757B;
  --card-bg: #FFF7FB;
  --page-bg: linear-gradient(160deg, #FFF1F7 0%, #FFF7FB 45%, #F4F0FF 100%);
  --yes-grad: linear-gradient(120deg, #E34F7B 0%, #F85589 50%, #F895B3 100%);
  --no-grad: linear-gradient(120deg, #D8D4E6 0%, #D0CCDD 100%);
}
html, body { height: 100%; }
body {
  font-family: var(--font-main);
  color: var(--ink);
  background: var(--page-bg);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  overflow-x: hidden;
}

/* ============================ PHONE CARD ============================ */
.invite {
  position: relative;
  width: 100%;
  max-width: 420px;
  min-height: min(720px, calc(100dvh - 32px));
  border-radius: 32px;
  background: var(--card-bg);
  box-shadow: 0 18px 50px -18px rgba(131, 24, 67, .22), 0 4px 14px rgba(131,24,67,.06);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
@media (min-width: 480px) {
  .invite { max-width: 400px; min-height: 700px; max-height: 92dvh; }
}

/* falling hearts layer */
.hearts { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.falling-heart { position: absolute; top: -80px; will-change: transform, opacity; opacity: 0; }
.falling-heart img { width: 100%; height: 100%; object-fit: contain; }
@keyframes falling-heart {
  0%   { opacity: .55; transform: translateY(0) rotate(0deg); }
  70%  { opacity: .55; transform: translateY(320px) rotate(var(--rot, 90deg)); }
  100% { opacity: 0;   transform: translateY(420px) rotate(calc(var(--rot, 90deg) * 1.5)); }
}

/* progress */
.progress { position: absolute; top: 0; left: 0; right: 0; height: 4px; background: rgba(227,79,123,.12); z-index: 5; }
.progress__bar { height: 100%; width: 0%; background: var(--yes-grad); transition: width .4s cubic-bezier(.4,0,.2,1); border-radius: 0 4px 4px 0; }

/* content area */
.screen {
  position: relative;
  z-index: 2;
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 44px 26px 26px;
  opacity: 0;
  transform: translateY(16px);
  transition: opacity .45s ease, transform .45s ease;
  overflow-y: auto;
  scrollbar-width: none;
}
.screen::-webkit-scrollbar { display: none; }
.screen.show { opacity: 1; transform: translateY(0); }
.screen.leaving { opacity: 0; transform: translateY(-16px); }

.screen__center { margin: auto 0; display: flex; flex-direction: column; gap: 26px; }

/* animations for content */
@keyframes content-enter { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes img-enter { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }

/* ============================ TYPO ============================ */
.title {
  font-family: var(--font-title);
  font-weight: 700;
  font-size: 24px;
  line-height: 1.08;
  text-align: center;
  color: var(--ink);
  white-space: pre-line;
  letter-spacing: -.01em;
}
.subtitle { text-align: center; font-size: 14px; line-height: 1.4; color: var(--muted); white-space: pre-line; }
.script { font-size: 13px; color: var(--muted); text-align: center; }

/* ============================ BUTTONS ============================ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  min-height: 54px;
  padding: 0 20px;
  border: none;
  border-radius: 60px;
  font-family: var(--font-main);
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  background: var(--yes-grad);
  cursor: pointer;
  box-shadow: inset 0 .5px 0 rgba(255,255,255,.35), 0 8px 18px -6px rgba(227,79,123,.5);
  transition: transform .16s ease, box-shadow .16s ease, opacity .2s ease;
  -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; pointer-events: none; }
.btn--no { background: var(--no-grad); color: #55546A; box-shadow: inset 0 .5px 0 rgba(255,255,255,.35), 0 8px 18px -8px rgba(120,110,150,.4); }
.btn--ghost { background: transparent; color: var(--muted); box-shadow: none; font-weight: 600; font-size: 14px; min-height: 44px; }
.btn--secondary { background: #fff; color: var(--accent); box-shadow: inset 0 0 0 2px rgba(227,79,123,.25), 0 6px 16px -8px rgba(227,79,123,.35); }
.btn--shake { animation: shake .5s ease; }
@keyframes shake {
  0%,100%{transform:translateX(0)} 15%{transform:translateX(-8px) rotate(-2deg)}
  30%{transform:translateX(8px) rotate(2deg)} 45%{transform:translateX(-6px)} 60%{transform:translateX(6px)} 80%{transform:translateX(-3px)}
}
.btn--explode { animation: explode .55s ease forwards; }
@keyframes explode { 0%{transform:scale(1)} 40%{transform:scale(1.18)} 100%{transform:scale(0); opacity:0} }

/* buttons row */
.btn-stack { display: flex; flex-direction: column; gap: 14px; }

/* floating "нет" that runs away */
.runaway { transition: transform .28s cubic-bezier(.34,1.56,.64,1); }

/* kiss pop */
.kiss { position: absolute; font-size: 26px; pointer-events: none; animation: kiss-fly .9s ease forwards; z-index: 9; }
@keyframes kiss-fly { 0%{opacity:1; transform:translate(-50%,-50%) scale(.6)} 100%{opacity:0; transform:translate(-50%,-160%) scale(1.4)} }

/* ============================ DATE STEP ============================ */
.date-card { display: flex; flex-direction: column; gap: 14px; }
.field {
  background: #fff;
  border-radius: 18px;
  padding: 12px 18px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  box-shadow: 0 2px 10px -4px rgba(131,24,67,.12);
  border: 1.5px solid rgba(227,79,123,.12);
}
.field label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.field input {
  border: none; outline: none; background: transparent;
  font-family: var(--font-main); font-size: 18px; font-weight: 700; color: var(--ink);
  padding: 0; width: 100%;
  -webkit-appearance: none;
}
.field input[type="date"], .field input[type="time"] { min-height: 28px; }

/* ============================ FOOD STEP ============================ */
.food-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.food-item {
  position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 14px 10px;
  border-radius: 20px;
  background: rgba(255,255,255,.85);
  border: 2px solid #F3CCD5;
  cursor: pointer;
  transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  font-family: var(--font-main);
}
.food-item:hover { transform: translateY(-2px); box-shadow: 0 8px 18px -8px rgba(243,136,185,.5); }
.food-item.selected { border-color: #F388B9; background: #fff; box-shadow: 0 10px 22px -8px rgba(243,136,185,.55); }
.food-item.selected::after {
  content: '✓'; position: absolute; top: 8px; right: 10px;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--yes-grad); color: #fff; font-size: 13px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.food-item__img { width: 62px; height: 62px; position: relative; }
.food-item__img img { width: 100%; height: 100%; object-fit: contain; display: block; }
.food-item__emoji { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 40px; }
.food-item__name { font-size: 14px; font-weight: 600; color: var(--ink); text-align: center; }
.food-item__check { display: none; }

/* ============================ FINAL ============================ */
.final-heart { font-size: 64px; text-align: center; animation: heartbeat 1.6s ease-in-out infinite; }
@keyframes heartbeat { 0%,100%{transform:scale(1)} 40%{transform:scale(1.14)} 60%{transform:scale(1.05)} }
.final-badge {
  align-self: center;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 18px; border-radius: 40px;
  background: rgba(227,79,123,.1); color: var(--accent);
  font-weight: 700; font-size: 14px;
}
.final-food { display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 15px; font-weight: 600; color: var(--ink); }
.final-food img { width: 44px; height: 44px; object-fit: contain; }

/* ============================ CONFETTI ============================ */
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 8; }
.confetti span { position: absolute; font-size: 18px; animation: confetti-fall linear forwards; }
@keyframes confetti-fall { to { transform: translateY(120vh) rotate(540deg); opacity: 0; } }

/* ============================ FOOTER ============================ */
.footer-note { text-align: center; font-size: 11px; color: #C7B6BE; padding: 10px; }
.footer-note a { color: #C7B6BE; text-decoration: none; }

/* nav back arrow */
.nav-back {
  position: absolute; top: 16px; left: 16px; z-index: 6;
  width: 40px; height: 40px; border-radius: 50%;

    const greet = el('h1', 'title', esc(CFG.greeting || ('Привет' + (CFG.herName ? ', ' + CFG.herName : '') + '!')));
    // SoyuzGrotesk — all-caps (нет строчных), поэтому для приветствия
    // используем Comfortaa, чтобы «Привет, Миленочка» было с обычным регистром
    greet.style.fontFamily = "'Comfortaa', -apple-system, sans-serif";
    greet.style.fontWeight = '700';
    greet.style.letterSpacing = '0';
    c.appendChild(greet);
    c.appendChild(el('p', 'subtitle', 'У меня для тебя есть маленькое приглашение…'));
    const btn = el('button', 'btn', 'Открыть открытку 💌');
    btn.onclick = () => showScreen('question');
    c.appendChild(btn);
    s.appendChild(c);
    return s;
  };

  /* ---------- question ---------- */
  buildScreen.question = () => {
    const s = el('div');
    const c = el('div', 'screen__center');
    const q = CFG.question || {};

    const card = el('div');
    card.style.animation = 'content-enter .55s ease-out both';
    const h = el('h2', 'title', esc(q.title || 'Ты пойдешь со мной на свидание?').replace(/\n/g, '<br>'));
    h.style.animation = 'content-enter .55s ease-out both';
    card.appendChild(h);
    c.appendChild(card);

    const stack = el('div', 'btn-stack');
    stack.style.animation = 'content-enter .55s ease-out .1s both';

    const yes = el('button', 'btn', esc(q.yes || 'Да ❤️'));
    yes.onclick = () => {
      yes.classList.add('btn--explode');
      setTimeout(() => showScreen('confirm'), 380);
    };
    stack.appendChild(yes);

    // "нет" runs away on hover / tap
    const no = el('button', 'btn btn--no runaway', esc(q.no || 'Нет'));
    let evade = 0;
    const runAway = (e) => {
      e && e.preventDefault();
      evade++;
      const dx = (Math.random() * 120 - 60) * (evade > 3 ? 2 : 1);
      const dy = (Math.random() * 30 - 15);
      no.style.transform = `translate(${dx}px, ${dy}px)`;
      if (evade === 1) no.textContent = 'Точно нет? 🥺';
      else if (evade === 2) no.textContent = 'Ну подумай ещё…';
      else if (evade === 3) no.textContent = 'Может всё-таки да? 🥹';
      else { no.textContent = 'Ладно, да ❤️'; no.onmouseenter = null; }
    };
    no.addEventListener('mouseenter', runAway);
    no.addEventListener('click', (e) => {
      if (evade < 4) { runAway(e); }
      else { yes.click(); }
    });
    stack.appendChild(no);
    c.appendChild(stack);

    // secret: falling hearts already there
    s.appendChild(c);
    return s;
  };

  /* ---------- confirm ---------- */
  buildScreen.confirm = () => {
    const s = el('div');
    const c = el('div', 'screen__center');
    const cf = CFG.confirm || {};
    const card = el('div');
    card.appendChild(el('h2', 'title', esc(cf.title || 'Ты действительно сказала да?').replace(/\n/g,'<br>')));
    card.appendChild(el('p', 'subtitle', esc(cf.subtitle || '')));
    card.style.animation = 'content-enter .5s ease-out both';
    c.appendChild(card);

    const btn = el('button', 'btn', esc(cf.button || 'Да Да дА'));
    btn.style.animation = 'content-enter .5s ease-out .12s both';
    btn.onclick = () => {
      burstKiss(btn);
      setTimeout(() => showScreen('datetime'), 300);
    };
    c.appendChild(btn);
    s.appendChild(c);
    return s;
  };

  function burstKiss(originEl) {
    const rect = originEl.getBoundingClientRect();
    const hostRect = document.getElementById('invite').getBoundingClientRect();
    for (let i = 0; i < 6; i++) {
      const k = el('div', 'kiss', ['💋','💗','❤️','😘','💕','💖'][i]);
      k.style.left = (rect.left - hostRect.left + rect.width/2 + (Math.random()*80-40)) + 'px';
      k.style.top = (rect.top - hostRect.top + (Math.random()*20-10)) + 'px';
      k.style.animationDelay = (i * 0.04) + 's';
      s_host().appendChild(k);
      setTimeout(() => k.remove(), 1000);
    }
  }
  const s_host = () => document.getElementById('invite');

  /* ---------- datetime ---------- */
  buildScreen.datetime = () => {
    const s = el('div');
    const c = el('div', 'screen__center');
    const d = CFG.datetime || {};

    const h = el('h2', 'title', esc(d.title || 'Когда ты свободна?'));
    h.style.animation = 'content-enter .5s ease-out both';
    c.appendChild(h);

    const wrap = el('div', 'date-card');
    wrap.style.animation = 'content-enter .5s ease-out .08s both';

    if (d.allowHerChoice !== false) {
      const f1 = el('div', 'field');
      f1.innerHTML = `<label>Дата</label>`;
      const di = el('input'); di.type = 'date'; di.value = state.date || _todayISO();
      di.min = _todayISO();
      di.oninput = () => { state.date = di.value; updateDateBtn(); };
      f1.appendChild(di);
      wrap.appendChild(f1);

      const f2 = el('div', 'field');
      f2.innerHTML = `<label>Время</label>`;
      const ti = el('input'); ti.type = 'time'; ti.value = state.time || '19:30';
      ti.oninput = () => { state.time = ti.value; updateDateBtn(); };
      f2.appendChild(ti);
      wrap.appendChild(f2);
    } else {
      const shown = el('div', 'final-badge', `📅 ${formatDate(state.date)} · ${state.time}`);
      wrap.appendChild(shown);
    }
    c.appendChild(wrap);

    const btn = el('button', 'btn', esc(d.button || 'Выбери дату ❤️'));
    btn.style.animation = 'content-enter .5s ease-out .16s both';
    btn.onclick = () => {
      if (!state.date || !state.time) { btn.classList.add('btn--shake'); setTimeout(()=>btn.classList.remove('btn--shake'),600); return; }
      showScreen('food');
    };
    const updateDateBtn = () => { /* always enabled; validated on click */ };
    c.appendChild(btn);

    s.appendChild(c);
    return s;
  };

  function formatDate(iso) {
    if (!iso) return '';
    const [y,m,d] = iso.split('-');
    const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    return `${parseInt(d,10)} ${months[parseInt(m,10)-1]} ${y}`;
  }

  /* ---------- food ---------- */
  buildScreen.food = () => {
    const s = el('div');
    const f = CFG.food || { items: [] };
    const c = el('div', 'screen__center');

    const head = el('div');
    head.appendChild(el('h2', 'title', esc(f.title || 'Что ты хочешь?')));
    if (f.subtitle) head.appendChild(el('p', 'subtitle', esc(f.subtitle)));
    head.style.animation = 'content-enter .5s ease-out both';
    c.appendChild(head);

    const grid = el('div', 'food-grid');
    grid.style.animation = 'content-enter .5s ease-out .08s both';

    (f.items || []).forEach((item, idx) => {
      const b = el('button', 'food-item');
      const imgWrap = el('div', 'food-item__img');
      if (item.img) {
        const im = el('img'); im.src = item.img; im.alt = item.name; im.loading = 'lazy';
        imgWrap.appendChild(im);
        im.onerror = () => { imgWrap.innerHTML = `<div class="food-item__emoji">${item.emoji || '🍽️'}</div>`; };
      } else {
        imgWrap.innerHTML = `<div class="food-item__emoji">${item.emoji || '🍽️'}</div>`;
      }
      b.appendChild(imgWrap);
      b.appendChild(el('span', 'food-item__name', esc(item.name)));

      if (state.foods.includes(item.name)) b.classList.add('selected');

      b.onclick = () => {
        if (f.multiple) {
          const i = state.foods.indexOf(item.name);
          if (i >= 0) state.foods.splice(i, 1); else state.foods.push(item.name);
          b.classList.toggle('selected');
        } else {
          state.foods = [item.name];
          grid.querySelectorAll('.food-item').forEach(x => x.classList.remove('selected'));
          b.classList.add('selected');
          // slight delay then continue
        }
        updateFoodBtn();
      };
      grid.appendChild(b);
    });
    c.appendChild(grid);

    const btn = el('button', 'btn', 'Продолжить ❤️');
    btn.style.animation = 'content-enter .5s ease-out .16s both';
    btn.disabled = state.foods.length === 0;
    btn.onclick = () => { if (state.foods.length) showScreen('final'); };
    const updateFoodBtn = () => { btn.disabled = state.foods.length === 0; };
    c.appendChild(btn);

    s.appendChild(c);
    return s;
  };

  /* ---------- final ---------- */
  buildScreen.final = () => {
    const s = el('div');
    const c = el('div', 'screen__center');
    const f = CFG.final || {};

    const heart = el('div', 'final-heart', f.heartEmoji || '💖');
    heart.style.animation = 'content-enter .5s ease-out both, heartbeat 1.6s ease-in-out .5s infinite';
    c.appendChild(heart);

    const title = el('h2', 'title', esc(f.title || 'Рад, что ты согласилась'));
    title.style.animation = 'content-enter .5s ease-out .1s both';
    c.appendChild(title);

    const foodName = state.foods.join(', ');
    const desc = (f.description || '')
      .replace('{date}', formatDate(state.date))
      .replace('{time}', state.time || '')
      .replace('{food}', foodName);
    const p = el('p', 'subtitle', esc(desc));
    p.style.animation = 'content-enter .5s ease-out .18s both';
    c.appendChild(p);

    if (foodName) {
      const chosen = (CFG.food?.items || []).filter(x => state.foods.includes(x.name));
      const badge = el('div', 'final-food');
      chosen.forEach(item => {
        if (item.img) { const im = el('img'); im.src = item.img; im.alt = item.name; badge.appendChild(im); }
        else if (item.emoji) badge.appendChild(el('span', '', item.emoji));
      });
      badge.appendChild(el('span', '', 'Твой выбор: ' + esc(foodName)));
      badge.style.animation = 'content-enter .5s ease-out .24s both';
      badge.style.flexWrap = 'wrap';
      c.appendChild(badge);
    }

    const again = el('button', 'btn btn--secondary', 'Посмотреть ещё раз 🔁');
    again.style.animation = 'content-enter .5s ease-out .36s both';
    again.onclick = () => { state.foods = []; state.step = 0; showScreen('question', { instant: false }); };

    // блок отправки ответа
    const reportBlock = buildReportBlock();
    reportBlock.style.animation = 'content-enter .5s ease-out .3s both';
    c.appendChild(reportBlock);
    c.appendChild(again);

    s.appendChild(c);
    launchConfetti();
    autoSendReport();
    return s;
  };

  /* ============================================================
   *  ОТПРАВКА ОТВЕТА
   * ============================================================ */
  function buildReportText() {
    const r = CFG.report || {};
    const tpl = r.template || "💌 Ответ:\n👤 {name}\n📅 {date}\n⏰ {time}\n🍽️ {food}";
    return tpl
      .replace('{name}', CFG.herName || '')
      .replace('{date}', formatDate(state.date))
      .replace('{time}', state.time || '')
      .replace('{food}', state.foods.join(', '));
  }

  function buildReportBlock() {
    const wrap = el('div');
    wrap.style.display = 'flex';
    wrap.style.flexDirection = 'column';
    wrap.style.gap = '10px';
    wrap.style.marginTop = '6px';
    wrap.id = 'reportBlock';

    const r = CFG.report || {};
    const text = buildReportText();
    const shareCfg = r.share || {};

    // ГЛАВНАЯ кнопка: отправить ответ в Telegram (работает без VPN)
    if (shareCfg.telegramUser) {
      const tgMain = el('button', 'btn', 'Отправить ответ в Telegram ✈️');
      tgMain.onclick = () => {
        const url = `https://t.me/${shareCfg.telegramUser.replace(/^@/,'')}?text=${encodeURIComponent(text)}`;
        window.open(url, '_blank');
        setReportStatus('Открылся чат в Telegram — нажми «Отправить» 💌');
      };
      wrap.appendChild(tgMain);
    } else {
      // если ник не задан — показываем авто-отправку как основную
      const send = el('button', 'btn', 'Отправить ответ 💌');
      send.onclick = async () => {
        const ok = await sendReport(text);
        if (ok) { send.textContent = 'Отправлено ✓'; send.disabled = true; }
      };
      wrap.appendChild(send);
    }

    // Ряд вторичных кнопок
    const row = el('div');
    row.style.display = 'flex';
    row.style.gap = '8px';
    row.style.justifyContent = 'center';
    row.style.flexWrap = 'wrap';

    // Копировать
    const copy = el('button', 'btn btn--ghost', '📋 Скопировать');
    copy.style.fontSize = '13px';
    copy.style.minHeight = '40px';
    copy.onclick = async () => {
      try { await navigator.clipboard.writeText(text); copy.textContent = 'Скопировано ✓'; }
      catch { copy.textContent = 'Не вышло :('; }
    };
    row.appendChild(copy);

    // WhatsApp (если задан номер)
    if (shareCfg.whatsappPhone) {
      const wa = el('button', 'btn btn--ghost', '💬 WhatsApp');
      wa.style.fontSize = '13px';
      wa.style.minHeight = '40px';
      wa.onclick = () => {
        const url = `https://wa.me/${shareCfg.whatsappPhone.replace(/[^\d]/g,'')}?text=${encodeURIComponent(text)}`;
        window.open(url, '_blank');
      };
      row.appendChild(wa);
    }

    wrap.appendChild(row);

    // скрытый статус
    const status = el('div', 'hint', '');
    status.id = 'reportStatus';
    wrap.appendChild(status);

    return wrap;
  }

  function setReportStatus(msg) {
    const elx = document.getElementById('reportStatus');
    if (elx) elx.textContent = msg;
  }

  async function sendReport(text) {
    const r = CFG.report || {};
    const mode = r.mode || 'share';
    const payload = {
      name: CFG.herName || '',
      date: formatDate(state.date),
      time: state.time || '',
      food: state.foods.join(', '),
      text,
    };

    try {
      /* ---- Google Apps Script: надёжно, не зависит от домена ---- */
      if (mode === 'apps-script') {
        const { url, secret } = r.appsScript || {};
        if (!url) { setReportStatus('Сервер не настроен (appsScript.url пустой).'); return false; }
        const resp = await fetch(url, {
          method: 'POST',
          // text/plain => без CORS-preflight (Apps Script его не любит)
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ secret: secret || '', ...payload }),
        });
        let out = {};
        try { out = await resp.json(); } catch {}
        if (!resp.ok || out.ok === false) {
          throw new Error('apps-script ' + resp.status + ' ' + (out.error || ''));
        }
        setReportStatus('Ответ отправлен ✓');
        return true;
      }

      if (mode === 'telegram') {
        const { botToken, chatId } = r.telegram || {};
        if (!botToken || !chatId) { setReportStatus('Не настроен Telegram (botToken/chatId).'); return false; }
        const url = `https://api.telegram.org/bot${botToken}/sendMessage`;
        const resp = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: chatId, text, disable_web_page_preview: true }),
        });
        if (!resp.ok) throw new Error('telegram ' + resp.status);
        setReportStatus('Ответ отправлен ✈️');
        return true;
      }

      if (mode === 'webhook') {
        const { url } = r.webhook || {};
        if (!url) { setReportStatus('Не настроен webhook URL.'); return false; }
        const payload = {
          name: CFG.herName || '',
          date: formatDate(state.date),
          time: state.time || '',
          food: state.foods.join(', '),
          text,
          _subject: '💌 Миленочка ответила на приглашение',
          _captcha: 'false',
          _template: 'table',
        };
        const resp = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (!resp.ok) throw new Error('webhook ' + resp.status);
        let data = {};
        try { data = await resp.json(); } catch {}
        if (data && data.success === 'false') {
          // Formsubmit: форма ещё не активирована
          setReportStatus('Нужно активировать форму: проверь почту и нажми «Activate».');
          return false;
        }
        setReportStatus('Ответ отправлен ✈️');
        return true;
      }

      // mode === 'share' — просто копируем/предлагаем отправить
      try { await navigator.clipboard.writeText(text); } catch {}
      setReportStatus('Текст скопирован — отправь любым способом 💌');
      return true;
    } catch (e) {
      setReportStatus('Не удалось отправить автоматически. Нажми «Скопировать» и перешли ответ.');
      return false;
    }
  }

  // если настроена автоматическая доставка — пробуем тихо, не мешая UX
  let _autoSent = false;
  function autoSendReport() {
    const r = CFG.report || {};
    if (_autoSent) return;
    // не пытаемся авто-отправлять, пока адрес сервера не задан
    if (r.mode === 'apps-script' && !(r.appsScript && r.appsScript.url)) return;
    if (r.mode === 'apps-script' || r.mode === 'telegram' || r.mode === 'webhook') {
      _autoSent = true;
      const text = buildReportText();
      // тихо: если не дойдёт (нет VPN/другой регион) — просто игнорируем,
      // у неё всё равно есть кнопка «Отправить в Telegram»
      setTimeout(() => {
        sendReport(text).catch(() => {});
      }, 600);
    }
  }

  function launchConfetti() {
    const wrap = el('div', 'confetti');
    const chars = ['💖','💕','💗','✨','💞','🤍'];
    for (let i = 0; i < 26; i++) {
      const sp = el('span', '', chars[i % chars.length]);
      sp.style.left = Math.random() * 100 + '%';
      sp.style.top = '-40px';
      sp.style.animationDuration = (2.5 + Math.random() * 2) + 's';
      sp.style.animationDelay = (Math.random() * 0.8) + 's';
      sp.style.fontSize = (12 + Math.random() * 16) + 'px';
      wrap.appendChild(sp);
    }
    s_host().appendChild(wrap);
    setTimeout(() => wrap.remove(), 5200);
  }

  /* ============================================================
   *  NAV / INIT
   * ============================================================ */
  navBack.onclick = () => {
    const cur = screens[state.step];
    if (cur === 'final') return;
    if (state.step > 1) { state.step -= 1; showScreen(screens[state.step]); }
    else { showScreen('question'); state.step = 1; }
  };

  // track step index whenever screen changes
  const _origShow = showScreen;
  showScreen = function(name, opts) {
    state.step = Math.max(0, screens.indexOf(name));
    return _origShow(name, opts);
  };
  window.showScreen = showScreen;

  initHearts();
  showScreen('intro', { instant: true });
  </script>
</body>
</html>
